<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SonicSweep · AI Underwater Debris Detection Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2304121c'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%233ee0ff'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%233ee0ff' stroke-opacity='.6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%233ee0ff' stroke-opacity='.3' stroke-width='2'/%3E%3Cpath d='M16 16 L30 16' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
/* ============================================================
   SONICSWEEP · COMMAND CONSOLE
   Theme tokens, base, layout, components
   ============================================================ */
:root{
  --bg-0:#020910;
  --bg-1:#04121c;
  --bg-2:#061e2c;
  --panel:#041421;
  --panel-2:#07202f;
  --panel-3:#0a2a3c;
  --line:#0d2c3d;
  --line-2:#12394d;
  --line-3:#1b4a63;
  --ink:#e6f6ff;
  --ink-2:#aac7d8;
  --ink-3:#6f90a3;
  --ink-4:#48657a;
  --cyan:#3ee0ff;
  --cyan-2:#17b8d9;
  --blue:#2f7fd6;
  --good:#36e0a0;
  --warn:#ffc457;
  --high:#ff8f5c;
  --bad:#ff5c6a;
  --radius:6px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg-0);
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1100px 520px at 78% -8%, rgba(23,110,160,.14), transparent 60%),
    radial-gradient(900px 480px at 8% 112%, rgba(30,90,190,.10), transparent 55%),
    linear-gradient(rgba(62,224,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(62,224,255,.022) 1px, transparent 1px);
  background-size:auto, auto, 46px 46px, 46px 46px;
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::selection{background:rgba(62,224,255,.28)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shared chrome ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:0 22px}

.navbar{
  position:sticky;top:0;z-index:60;
  border-bottom:1px solid var(--line);
  background:rgba(3,14,22,.86);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.nav-inner{
  max-width:1440px;margin:0 auto;padding:0 22px;
  display:flex;align-items:center;gap:18px;height:60px;
}
.brand{display:flex;align-items:center;gap:12px;margin-right:6px}
.brand-mark{width:34px;height:34px;position:relative;flex:none}
.brand-mark svg{position:absolute;inset:0}
.brand-name{line-height:1.05}
.brand-name b{display:block;font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.brand-name span{display:block;font-size:9px;font-weight:600;letter-spacing:.3em;color:var(--ink-3)}
.nav-links{display:flex;gap:2px;margin-left:10px}
.nav-links a{
  padding:8px 12px;font-size:11.5px;font-weight:600;letter-spacing:.12em;
  color:var(--ink-3);border-bottom:2px solid transparent;transition:color .18s,border-color .18s;
}
.nav-links a:hover{color:var(--ink-2)}
.nav-links a.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.sys-pill{
  display:inline-flex;align-items:center;gap:8px;padding:5px 11px;
  border:1px solid var(--line-2);border-radius:999px;background:var(--panel);font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--ink-2);
}
.sys-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(54,224,160,.6);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(54,224,160,.55)}70%{box-shadow:0 0 0 7px rgba(54,224,160,0)}}
.utc{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.06em}
.utc b{color:var(--ink-2)}
.burger{display:none;padding:7px;border:1px solid var(--line-2);border-radius:var(--radius)}
.burger span{display:block;width:16px;height:1.5px;background:var(--ink-2);margin:3px 0}
.mobile-nav{display:none;border-top:1px solid var(--line);background:var(--bg-1);padding:8px 22px 14px}
.mobile-nav.open{display:block}
.mobile-nav a{display:block;padding:11px 4px;color:var(--ink-2);font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.mobile-nav a.active{color:var(--cyan)}

/* ---------- hero / mission strip ---------- */
.hero{padding:34px 0 6px}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:10px;font-size:10.5px;font-weight:700;letter-spacing:.26em;
  color:var(--cyan);border:1px solid rgba(62,224,255,.25);border-radius:999px;padding:5px 12px;background:rgba(62,224,255,.05);
}
.hero-eyebrow .tick{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:pulse 1.8s infinite}
.hero h1{font-size:clamp(24px,3.4vw,40px);font-weight:800;letter-spacing:.02em;margin:16px 0 8px;line-height:1.12}
.hero h1 .acc{color:var(--cyan)}
.hero p{max-width:760px;color:var(--ink-2);font-size:14px;margin:0}
.mission-strip{
  margin-top:22px;display:flex;flex-wrap:wrap;gap:0;
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel),rgba(4,20,33,.4));
  overflow:hidden;
}
.ms{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--line);min-width:0;white-space:nowrap}
.ms:last-child{border-right:none}
.ms .k{font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--ink-4)}
.ms .v{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.ms .v b{color:var(--ink)}

/* ---------- layout ---------- */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:18px 0 40px}
.section{scroll-margin-top:76px}

/* ---------- panels ---------- */
.panel{
  position:relative;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel),rgba(4,20,33,.35));
  overflow:hidden;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--line);
}
.panel-title{display:flex;align-items:center;gap:10px;min-width:0}
.panel-title .ic{width:26px;height:26px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex:none}
.panel-title .ic svg{width:14px;height:14px;stroke:var(--cyan)}
.panel-title h3{font-size:12px;font-weight:700;letter-spacing:.16em;margin:0;color:var(--ink)}
.panel-title .sub{font-size:10px;color:var(--ink-4);letter-spacing:.06em}
.panel-body{padding:16px}
.tag{
  font-size:9.5px;font-weight:700;letter-spacing:.16em;padding:3px 8px;border-radius:4px;
  border:1px solid var(--line-2);color:var(--ink-3);background:var(--panel-2);
}
.tag.cyan{color:var(--cyan);border-color:rgba(62,224,255,.3);background:rgba(62,224,255,.06)}

/* ---------- stat cards ---------- */
.stat{
  grid-column:span 2;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel),rgba(4,20,33,.35));
  padding:14px 16px 12px;position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s;
}
.stat:hover{border-color:var(--line-3);transform:translateY(-1px)}
.stat .rule{position:absolute;left:0;top:0;height:2px;width:0;transition:width .6s ease}
.stat:hover .rule{width:100%}
.stat .k{font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--ink-4)}
.stat .v{font-size:26px;font-weight:800;letter-spacing:.02em;margin-top:6px;color:var(--ink);line-height:1}
.stat .d{font-size:10.5px;color:var(--ink-4);margin-top:6px}
.stat .d .up{color:var(--good)}
.stat.blue .rule{background:linear-gradient(90deg,var(--cyan),transparent)}
.stat.green .rule{background:linear-gradient(90deg,var(--good),transparent)}
.stat.amber .rule{background:linear-gradient(90deg,var(--warn),transparent)}
.stat.red .rule{background:linear-gradient(90deg,var(--bad),transparent)}
.stat .mini{height:18px;margin-top:9px;display:flex;align-items:flex-end;gap:2px}
.stat .mini i{flex:1;background:var(--cyan-2);opacity:.85;border-radius:1px}

/* ---------- sonar scope ---------- */
.sonar-wrap{grid-column:span 8;min-width:0}
.controls{grid-column:span 4;min-width:0}
.scope-stage{display:flex;gap:18px;align-items:stretch;padding:16px}
.scope-box{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-width:0}
.scope{
  position:relative;width:min(430px,100%);aspect-ratio:1/1;border-radius:50%;
  touch-action:none;user-select:none;
}
/* screen face */
.scope-face{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(8,32,46,.0) 0%, rgba(8,32,46,.0) 62%, rgba(2,9,16,.0) 100%),
    radial-gradient(circle at 50% 50%, #031019 0%, #041a29 62%, #020d17 100%);
  border:1px solid var(--line-2);
  box-shadow:inset 0 0 60px rgba(3,22,34,.9), 0 0 0 6px rgba(126,180,200,.06), 0 0 30px rgba(23,120,170,.12);
  overflow:hidden;
}
.scope::after{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(62,224,255,.12), inset 0 0 26px rgba(0,0,0,.6);
}
.scope-ring{position:absolute;inset:0;border-radius:50%}
.scope-ring.r1{inset:12.5%}
.scope-ring.r2{inset:25%}
.scope-ring.r3{inset:37.5%}
.scope-criss{position:absolute;inset:0;opacity:.5}
.scope-criss::before,
.scope-criss::after{content:"";position:absolute;background:rgba(104,175,205,.13)}
.scope-criss::before{left:50%;top:0;bottom:0;width:1px}
.scope-criss::after{top:50%;left:0;right:0;height:1px}
.scope-ring{background:
  linear-gradient(0deg, rgba(104,175,205,.10) 1px, transparent 1px) 50% 50%/100% 25.0006% repeat-x,
  linear-gradient(90deg, rgba(104,175,205,.10) 1px, transparent 1px) 50% 50%/25.0006% 100% repeat-y;
}
.sweep{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;will-change:transform;
  background:conic-gradient(from 0deg,
    rgba(62,224,255,0) 0deg,
    rgba(62,224,255,0) 74deg,
    rgba(62,224,255,.06) 84deg,
    rgba(62,224,255,.5) 89deg,
    #cff6ff 90deg,
    rgba(102,214,255,.55) 91deg,
    rgba(62,224,255,.10) 98deg,
    rgba(62,224,255,0) 122deg);
  mix-blend-mode:screen;
}
.sweep::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, transparent 0 96%, #3ee0ff 97% 100%);
  opacity:.0;
}
.blip{
  position:absolute;width:0;height:0;z-index:5;
  opacity:0;transition:opacity .45s ease;
}
.blip.lit{opacity:1}
.blip .px{
  position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid rgba(3,14,22,.9);
  box-shadow:0 0 8px 1px currentColor;
}
.blip .ring{
  position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid currentColor;opacity:0;transition:opacity .2s;
}
.blip.sel .ring{opacity:.9}
.blip.sel .px{box-shadow:0 0 0 2px rgba(3,14,22,.6),0 0 12px 2px currentColor}
.blip .lab{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-160%);
  background:rgba(3,14,22,.88);border:1px solid var(--line-2);
  padding:2px 6px;border-radius:4px;font-size:8.5px;font-weight:700;letter-spacing:.08em;
  color:var(--ink-2);white-space:nowrap;z-index:6;display:flex;gap:5px;align-items:center;
}
.blip .lab b{color:var(--ink)}
.blip .lab i{font-style:normal;font-weight:700}
.scope-readouts{position:absolute;inset:0;pointer-events:none;z-index:8}
.read{position:absolute;font-size:8.5px;font-weight:700;letter-spacing:.14em;color:rgba(160,206,222,.7)}
.read.tl{top:8px;left:12px}.read.tr{top:8px;right:12px}.read.bl{bottom:8px;left:12px}.read.br{bottom:8px;right:12px}
.read.sim{top:8px;right:38px;color:var(--warn)}
.center-mark{
  position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
  opacity:.8;pointer-events:none;
}
.bearing-tape{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.bearing-tape i{
  position:absolute;left:50%;top:0;width:1px;height:6px;background:rgba(133,203,224,.5);
  transform-origin:top;transform:translateX(-.5px) rotate(var(--a));
}
.bearing-tape i::after{content:"";position:absolute;left:-.5px;bottom:0;height:1px;background:inherit}

/* contact queue */
.queue{width:236px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0}
.queue .qh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.queue .qh span{font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--ink-4)}
.queue .qh em{font-style:normal;font-size:10px;color:var(--cyan-2);font-weight:700}
.qlist{flex:1;overflow:auto;padding:6px}
.qitem{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid transparent;border-radius:5px;
  transition:background .18s,border-color .18s;cursor:pointer;animation:qin .35s ease both;
}
@keyframes qin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.qitem:hover{background:var(--panel-2);border-color:var(--line-2)}
.qitem .qdot{width:8px;height:8px;flex:none;border:1px solid rgba(3,14,22,.8);box-shadow:0 0 6px currentColor}
.qitem .qinfo{min-width:0;flex:1}
.qitem .qinfo b{display:block;font-size:11px;font-weight:700;color:var(--ink);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .qinfo span{display:block;font-size:9px;color:var(--ink-4);margin-top:1px}
.qitem .qrisk{font-size:9.5px;font-weight:700;color:var(--ink-3);flex:none;letter-spacing:.04em}

/* sonar transport controls */
.sonar-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
.btn{
  display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.1em;
  padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--radius);
  color:var(--ink-2);background:var(--panel-2);transition:background .18s,color .18s,border-color .18s,transform .12s;
}
.btn:hover{background:var(--panel-3);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:rgba(62,224,255,.12);border-color:rgba(62,224,255,.4);color:var(--cyan)}
.btn.primary:hover{background:rgba(62,224,255,.2)}
.btn svg{width:13px;height:13px}
.btn-group{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.btn-group button{padding:8px 11px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);background:var(--panel-1, transparent);border-right:1px solid var(--line-2);transition:background .15s,color .15s}
.btn-group button:last-child{border-right:none}
.btn-group button:hover{color:var(--ink-2)}
.btn-group button.on{background:rgba(62,224,255,.14);color:var(--cyan)}

/* ---------- survey control ---------- */
.ctl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctl-block label{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--ink-4);margin-bottom:7px}
.ctl-block label b{color:var(--ink-2);letter-spacing:.02em}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan) var(--p,50%), var(--line-2) var(--p,50%));
  outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg-0);box-shadow:0 0 0 1px rgba(62,224,255,.5)}
.slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg-0)}
.mode-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{
  padding:10px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:var(--radius);background:var(--panel-2);transition:all .16s;
}
.mode.on{color:#02121d;background:var(--cyan);border-color:var(--cyan)}
.ctl-read{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--radius);margin-top:14px;overflow:hidden}
.cr{flex:1 1 45%;padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cr:nth-child(even){border-right:none}
.cr:nth-last-child(-n+2){border-bottom:none}
.cr .k{font-size:8.5px;font-weight:700;letter-spacing:.18em;color:var(--ink-4)}
.cr .v{font-size:13px;font-weight:700;color:var(--ink-2);margin-top:2px;letter-spacing:.04em}
.line-progress{margin-top:14px}
.line-progress .lp{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.12em;color:var(--ink-4);font-weight:700}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan-2),var(--cyan));transition:width .8s ease}

/* ---------- analysis ---------- */
.analysis{grid-column:span 12}
.an-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:0;min-height:420px}
.an-stage{display:flex;align-items:center;justify-content:center;padding:20px;background:
  radial-gradient(600px 300px at 50% 0%, rgba(23,110,160,.10), transparent 65%), var(--bg-1);min-width:0}
.drop{
  width:100%;max-width:640px;border:1px dashed var(--line-3);border-radius:var(--radius);
  background:rgba(10,42,60,.25);transition:all .2s;cursor:pointer;
  text-align:center;padding:34px 20px;
}
.drop.drag{border-color:var(--cyan);background:rgba(62,224,255,.07)}
.drop .dicon{width:44px;height:44px;margin:0 auto 12px;border:1px solid var(--line-2);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel-2)}
.drop .dicon svg{width:20px;height:20px;stroke:var(--cyan)}
.drop b{display:block;font-size:13px;color:var(--ink-2)}
.drop span{font-size:11px;color:var(--ink-4);display:block;margin-top:4px}
.preview{position:relative;width:100%;max-width:640px;display:flex;justify-content:center;background:#000}
.preview .astage{position:relative;width:100%}
.preview img{display:block;width:100%;height:100%;object-fit:fill}
.preview .vign{position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--line-2);pointer-events:none}
.bbox{position:absolute;cursor:pointer;transition:box-shadow .15s;pointer-events:auto}
.bbox .bx{position:absolute;inset:0;transition:box-shadow .15s}
.bbox.sel .bx{box-shadow:0 0 0 1.5px currentColor,0 0 14px 1px currentColor}
.bbox:not(.sel):hover .bx{box-shadow:0 0 0 1px currentColor}
.bbox .corners{position:absolute;inset:-3px;pointer-events:none}
.bbox .corners i{position:absolute;width:7px;height:7px;border-color:currentColor;border-style:solid;border-width:0}
.bbox .corners i.tl{top:0;left:0;border-width:1.5px 0 0 1.5px}
.bbox .corners i.tr{top:0;right:0;border-width:1.5px 1.5px 0 0}
.bbox .corners i.bl{bottom:0;left:0;border-width:0 0 1.5px 1.5px}

      if (start === undefined) start = t;
      const p = Math.min((t - start) / dur, 1);
      setV(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, dur]);
  return v;
}
const reveal = (node) => {
  if (!node) return;
  const io = new IntersectionObserver((en) => {
    en.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.08 });
  io.observe(node);
};

/* ---------- uptime + clock ---------- */
function useUptime() {
  const [s, setS] = useState(0);
  useEffect(() => { const t = setInterval(() => setS((x) => x + 1), 1000); return () => clearInterval(t); }, []);
  const hh = String(Math.floor(s / 3600)).padStart(2, "0");
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const ssC = String(s % 60).padStart(2, "0");
  return `${hh}:${mm}:${ssC}`;
}
function useUtcClock() {
  const [t, setT] = useState(new Date());
  useEffect(() => { const i = setInterval(() => setT(new Date()), 1000); return () => clearInterval(i); }, []);
  return t.toUTCString().slice(17, 25);
}

/* ---------- sonar scope ---------- */
function SonarScope() {
  const [contacts, setContacts] = useState(SEED_BLIPS);
  const [lit, setLit] = useState([]);
  const [sel, setSel] = useState(null);
  const [playing, setPlaying] = useState(true);
  const [speed, setSpeed] = useState(1);
  const angleRef = useRef(0);
  const playRef = useRef(true);
  const speedRef = useRef(38);
  const sweepEl = useRef(null);

  useEffect(() => {
    const t = setInterval(() => {
      setContacts((prev) => {
        if (prev.length >= 26) return prev;
        const idx = prev.length;
        const cls = CLS_LIST[Math.floor(Math.random() * CLS_LIST.length)];
        const c = { id: "b" + (idx + 100), bearing: rng(0, 359), rng: rng(16, 84), cls,
                    conf: rng(0.62, 0.94), risk: Math.round(rng(38, 90)) };
        return [...prev, c];
      });
    }, 9000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    playRef.current = playing;
  }, [playing]);
  useEffect(() => {
    speedRef.current = 38 * speed;
  }, [speed]);

  useEffect(() => {
    let raf, last = performance.now();
    const loop = (t) => {
      const dt = Math.min((t - last) / 1000, 0.1);
      last = t;
      if (playRef.current) {
        angleRef.current = (angleRef.current + dt * speedRef.current) % 360;
        if (sweepEl.current) sweepEl.current.style.transform = `rotate(${angleRef.current}deg)`;
        const head = angleRef.current;
        setLit((prev) => {
          let changed = false;
          const next = prev.slice();
          for (const c of contacts) {
            if (!next.includes(c.id)) {
              const d = Math.abs(((head - c.bearing + 540) % 360) - 180);
              if (d < 4.5) { next.push(c.id); changed = true; }
            }
          }
          return changed ? next : prev;
        });
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [contacts]);

  const resetSweep = () => {
    angleRef.current = 0;
    if (sweepEl.current) sweepEl.current.style.transform = "rotate(0deg)";
    setLit([]);
    setSel(null);
  };

  const blips = useMemo(() => contacts.map((c) => {
    const rad = (c.bearing * Math.PI) / 180;
    const R = 46;
    const px = 50 + R * Math.sin(rad);
    const py = 50 - R * Math.cos(rad);
    return { ...c, px, py };
  }), [contacts]);
  const litList = blips.filter((b) => lit.includes(b.id));
  const queue = litList.slice().reverse();

  return (
    <div className="panel">
      <div className="panel-head">
        <div className="panel-title">
          <span className="ic"><svg viewBox="0 0 24 24" fill="none" strokeWidth="2"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/></svg></span>
          <div>
            <h3>LIVE SONAR FEED</h3>
            <div className="sub">Sector-scan · 455 kHz · 500 m range</div>
          </div>
        </div>
        <span className="tag cyan">SCANNING</span>
      </div>

      <div className="scope-stage">
        <div className="scope-box">
          <div className="scope">
            <div className="scope-face">
              <div className="scope-criss" />
              <div className="scope-ring r1" />
              <div className="scope-ring r2" />
              <div className="scope-ring r3" />
              <div className="bearing-tape">
                {Array.from({ length: 12 }).map((_, i) => (
                  <i key={i} style={{ ["--a"]: `${i * 30}deg` }} />
                ))}
              </div>
              <div className="sweep" ref={sweepEl} />
              {blips.map((b) => (
                <div key={b.id} className={`blip ${lit.includes(b.id) ? "lit" : ""} ${sel === b.id ? "sel" : ""}`}
                     style={{ left: `${b.px}%`, top: `${b.py}%`, color: CLASS_META[b.cls].hex }}
                     onClick={() => setSel(b.id)}>
                  <span className="ring" />
                  <span className="px" />
                  {lit.includes(b.id) && (
                    <span className="lab">
                      <b>{CLASS_META[b.cls].label}</b>
                      <i style={{ color: riskMeta(b.risk).hex }}>{pct(b.conf)}</i>
                    </span>
                  )}
                </div>
              ))}
              <div className="scope-readouts">
                <div className="read tl">RNG 500 m</div>
                <div className="read tr">SCT 360°</div>
                <div className="read sim">SIM</div>
                <div className="read bl">MOD S/A</div>
                <div className="read br">HDG 214°</div>
              </div>
            </div>
          </div>
        </div>

        <div className="queue">
          <div className="qh"><span>CONTACT QUEUE</span><em>{queue.length}</em></div>
          <div className="qlist">
            {queue.length === 0 && (
              <div style={{ padding: 14, fontSize: 11, color: "#48657a" }}>Awaiting contacts on next sweep pass…</div>
            )}
            {queue.map((c) => (
              <div key={c.id} className="qitem" onClick={() => setSel(c.id)}>
                <span className="qdot" style={{ background: riskMeta(c.risk).hex, color: riskMeta(c.risk).hex }} />
                <span className="qinfo">
                  <b>{CLASS_META[c.cls].label}</b>
                  <span>CONF {pct(c.conf)} · BRG {String(Math.round(c.bearing)).padStart(3, "0")}°</span>
                </span>
                <span className="qrisk" style={{ color: riskMeta(c.risk).hex }}>{riskMeta(c.risk).label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="sonar-ctl">
        <button className="btn primary" onClick={() => setPlaying((p) => !p)}>
          {playing ? <Pause /> : <Play />}{playing ? "PAUSE" : "SCAN"}
        </button>
        <div className="btn-group">
          {[0.5, 1, 2].map((s) => (
            <button key={s} className={speed === s ? "on" : ""} onClick={() => setSpeed(s)}>
              {s}x
            </button>
          ))}
        </div>
        <button className="btn" onClick={resetSweep}>RESET</button>
        <span className="samp" style={{ marginLeft: "auto" }}>{queue.length} CONTACTS</span>
      </div>
    </div>
  );
}

                {done && DETS.map((d) => {

            <span className="sv tnum">{s.v}</span>
          </div>
        ))}
      </div>
      <div className="sys-foot">
        <span>UPTIME <b className="tnum">{uptime}</b></span>
        <span className="samp tnum">PINGS {samp.toLocaleString()}</span>
        <button className="btn" style={{ padding: "5px 10px", fontSize: 10 }}>DIAGNOSTIC</button>
      </div>
    </div>
  );
}

/* ---------- archive ---------- */
function Archive() {
  const [sel, setSel] = useState("d6");
  return (
    <div className="panel">
      <div className="panel-head">
        <div className="panel-title">
          <span className="ic"><svg viewBox="0 0 24 24" fill="none" strokeWidth="2"><path d="M4 7l3-3h10l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 7h16"/><path d="M9 12h6"/></svg></span>
          <div><h3>DETECTION ARCHIVE</h3><div className="sub">Top confidence contacts · current mission</div></div>
        </div>
        <span className="tag">246 TOTAL</span>
      </div>
      <div className="cards">
        {DETS.map((d, idx) => {
          const r = riskMeta(d.risk);
          return (
            <div key={d.id} className={`dcard ${sel === d.id ? "sel" : ""}`}
                 style={{ animationDelay: `${idx * 60}ms` }} onClick={() => setSel(d.id)}>
              <div className="dthumb">
                <div className="noise" />
                <div className="hl" />
                <div className="box" style={{ left: `${(d.x) * 100}%`, top: `${(d.y) * 100}%`, width: `${d.w * 100}%`, height: `${d.h * 100}%`, color: r.hex, borderColor: r.hex }} />
              </div>
              <div className="dhead">
                <b>CONTACT {d.id.toUpperCase()}</b>
                <span className="rl" style={{ background: r.hex }}>{r.label}</span>
              </div>
              <div className="dname">{CLASS_META[d.cls].label}</div>
              <div className="dmeta">{d.time} UTC · EST. {d.size} m</div>
              <div className="mrow">
                <span className="ml">CONFIDENCE</span>
                <div className="bar"><i style={{ width: `${d.conf * 100}%` }} /></div>
                <span className="mv tnum">{d.conf * 100}</span>
              </div>
              <div className="mrow" style={{ paddingBottom: 12 }}>
                <span className="ml">RISK</span>
                <div className="bar"><i style={{ width: `${d.risk}%`, background: "linear-gradient(90deg,#17b8d9,#3ee0ff)" }} /></div>
                <span className="mv tnum">{d.risk}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- analytics ---------- */
function Analytics() {
  const maxClass = Math.max(...BY_CLASS.map(([, n]) => n));
  const totalDist = RISK_DIST.reduce((s, [, n]) => s + n, 0);
  return (
    <>
      <div className="panel chart-panel">
        <div className="panel-head">
          <div className="panel-title"><span className="ic"><svg viewBox="0 0 24 24" fill="none" strokeWidth="2"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-8"/><path d="M22 20H2"/></svg></span><div><h3>DETECTIONS BY CLASS</h3><div className="sub">All archived missions</div></div></div>
        </div>
        <div className="chart-body">
          {BY_CLASS.map(([cls, n]) => (
            <div className="hbar" key={cls}>
              <span className="hl">{CLASS_META[cls].label}</span>
              <div className="bar"><i style={{ width: `${(n / maxClass) * 100}%`, background: CLASS_META[cls].hex, opacity: 0.9 }} /></div>
              <span className="hv tnum">{n}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="panel chart-panel">
        <div className="panel-head">
          <div className="panel-title"><span className="ic"><svg viewBox="0 0 24 24" fill="none" strokeWidth="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 2 5-6"/></svg></span><div><h3>RISK DISTRIBUTION</h3><div className="sub">Fused AI + anomaly scores</div></div></div>
        </div>
        <div className="chart-body">
          <div className="ck">246 DETECTIONS</div>
          <div className="dist">
            {RISK_DIST.map(([l, n, hex], idx) => (
              <div className="col" key={l}>
                <div className="cb" style={{ background: hex, height: `${(n / totalDist) * 100}%` }} />
                <div className="cv tnum">{n}</div>
                <div className="cpct tnum">{Math.round((n / totalDist) * 100)}%</div>
                <div className="cl">{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

/* ---------- app ---------- */
function App() {
  const [menu, setMenu] = useState(false);
  const utc = useUtcClock();
  const uptime = useUptime();
  const refs = useRef({});
  const [active, setActive] = useState("#overview");

  useEffect(() => {
    const ids = ["overview", "sonar", "analysis", "map", "system", "register"];
    const io = new IntersectionObserver((en) => {
      en.forEach((e) => { if (e.isIntersecting) setActive("#" + e.target.id); });
    }, { threshold: 0.35 });
    ids.forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);

  const links = [
    ["#overview", "OVERVIEW"],
    ["#sonar", "SONAR"],
    ["#analysis", "ANALYSIS"],
    ["#map", "MAP"],
    ["#system", "SYSTEM"],
  ];
  refs.current.utc = utc;

  return (
    <>
      <div className="navbar">
        <div className="nav-inner">
          <div className="brand">
            <div className="brand-mark"><IconMark /></div>
            <div className="brand-name"><b>SONICSWEEP</b><span>MARINE INTELLIGENCE</span></div>
          </div>
          <nav className="nav-links">
            {links.map(([href, label]) => (
              <a key={href} href={href} className={active === href ? "active" : ""}>{label}</a>
            ))}
          </nav>
          <div className="nav-right">
            <div className="utc">UTC <b className="tnum">{utc}</b></div>
            <span className="sys-pill"><span className="dot" />ALL SYSTEMS NOMINAL</span>
            <button className="burger" aria-label="Menu" onClick={() => setMenu((m) => !m)}>
              <span /><span /><span />
            </button>
          </div>
        </div>
        <div className={`mobile-nav ${menu ? "open" : ""}`}>
          {links.map(([href, label]) => (
            <a key={href} href={href} className={active === href ? "active" : ""} onClick={() => setMenu(false)}>
              {label}
            </a>
          ))}
        </div>
      </div>

      <div className="wrap">
        <section className="hero">
          <span className="hero-eyebrow"><span className="tick" />AI SURVEILLANCE · SIDE-SCAN SONAR</span>
          <h1>AI-Powered Underwater <span className="acc">Debris &amp; Anomaly Detection</span></h1>
          <p>Automated target recognition on side-scan sonar strips — preprocessing, deep inference, anomaly
             classification and risk scoring streamed live from the survey vessel.</p>

          <div className="mission-strip">
            <div className="ms"><div className="k">MISSION</div><div className="v">SS-042 · <b>DEEP-CLEAN</b></div></div>
            <div className="ms"><div className="k">REGION</div><div className="v">BIMINI GRAND BANKS</div></div>
            <div className="ms"><div className="k">VESSEL</div><div className="v">R/V MERIDIAN</div></div>
            <div className="ms"><div className="k">OPERATOR</div><div className="v">OPS LT. K. VANCE</div></div>
            <div className="ms"><div className="k">BOTTOM TIME</div><div className="v tnum">{uptime}</div></div>
          </div>
        </section>

        <section id="overview" className="section">
          <div className="dash" style={{ paddingTop: 16 }}>
            <StatCard label="SCANS LOGGED" value={128} sub="+12 THIS MISSION" tone="blue" />
            <StatCard label="DETECTIONS" value={246} sub="ALL ARCHIVED MISSIONS" tone="blue" />
            <StatCard label="HIGH-RISK TARGETS" value={63} sub="98% REVIEWED" tone="red" />
            <StatCard label="AVG CONFIDENCE" value={87} sub={<span className="up">▴ 2.1% VS LAST</span>} tone="green" bars={[30,44,52,48,60,70,66,80,88]} />
            <StatCard label="AREA COVERED" value={14} sub="KM² SURVEYED" tone="blue" />
            <StatCard label="MISSION UPTIME" value={0} sub="HRS · LIVE" tone="green" />
          </div>
        </section>

        <section id="sonar" className="section">
          <div className="dash">
            <div className="sonar-wrap"><SonarScope /></div>
            <div className="controls"><SurveyControl /></div>
          </div>
        </section>

        <section id="analysis" className="section">
          <div className="dash"><Analysis /></div>
        </section>

        <section id="map" className="section">
          <div className="dash">
            <div className="map-wrap"><AnomalyMap /></div>
            <div className="systems"><Systems /></div>
          </div>
        </section>

        <section id="system" className="section">
          <div className="dash" style={{ paddingBottom: 0 }}>
            <div style={{ gridColumn: "span 12" }}><Archive /></div>
          </div>
        </section>

        <section className="section">
          <div className="dash">
            <Analytics />
          </div>
        </section>
      </div>

      <footer className="footer">
        <div className="foot-inner">
          <div className="fg"><b>SONICSWEEP</b><span>MARINE INTELLIGENCE PLATFORM</span></div>
          <div className="fg">
            <span>25.63°N · 79.38°W</span>
            <span>INTER · DEMO DATA — SYNTHETIC VISUALISATION</span>
            <span>v0.1.0</span>
          </div>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
